<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>단청 이음 연구소</title>
<style>
  :root{
    --bg:#faf5e9; --paper:#fffdf7; --ink:#3b2f28; --ink-soft:#6b5c50;
    --red:#b23b2e; --blue:#2c5a78; --green:#5c7a4d; --gold:#c8932f;
    --line:#e6dcc8; --radius:20px; --shadow:0 6px 18px rgba(80,60,30,0.09);
    --fs-base:16px;
  }
  *{box-sizing:border-box;}
  html{font-size:var(--fs-base);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55; padding-bottom:64px;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(200,147,47,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(178,59,46,0.06) 0, transparent 40%);
  }
  #app{max-width:560px; margin:0 auto; padding:20px 18px 40px;}
  h1{font-size:1.5rem; margin:0 0 4px;}
  h2{font-size:1.15rem; margin:0 0 10px; color:var(--ink);}
  h3{font-size:1rem; margin:0 0 8px;}
  p{margin:0 0 12px;}
  .muted{color:var(--ink-soft); font-size:0.9rem;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .center{text-align:center;}
  .top-brand{text-align:center; margin:18px 0 26px;}
  .top-brand .sub{font-size:0.95rem; color:var(--ink-soft);}
  .top-brand .motif{font-size:2.6rem; margin:6px 0;}
  input[type=text], input[type=email], input[type=number], input[type=tel], textarea{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
    font-size:1rem; background:#fff; color:var(--ink); font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  label.field-label{display:block; font-weight:600; margin:14px 0 6px; font-size:0.95rem;}
  .char-count{text-align:right; font-size:0.78rem; color:var(--ink-soft); margin-top:2px;}
  .btn{
    display:inline-block; border:none; border-radius:14px; padding:13px 20px;
    font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-main{
    display:block; width:100%; padding:17px; font-size:1.08rem;
    background:linear-gradient(135deg,var(--red),#8f2c22); color:#fff;
    box-shadow:0 6px 14px rgba(178,59,46,0.28); margin-top:18px;
  }
  .btn-main:disabled{background:#cbb9a6; box-shadow:none; cursor:not-allowed;}
  .btn-secondary{background:#fff; border:1px solid var(--line); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--blue); text-decoration:underline; padding:8px 0;}
  .btn-small{padding:8px 14px; font-size:0.85rem; border-radius:10px;}
  .btn-danger{background:#fff; border:1px solid var(--red); color:var(--red);}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .scale-row{display:flex; gap:8px; justify-content:space-between; margin:8px 0;}
  .scale-opt{
    flex:1; text-align:center; padding:12px 4px; border:2px solid var(--line); border-radius:12px;
    cursor:pointer; font-weight:700; background:#fff;
  }
  .scale-opt.selected{border-color:var(--gold); background:#fbeecb; color:#8a6217;}
  .status-badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:700;}
  .status-done{background:#e4efdd; color:var(--green);}
  .status-progress{background:#fbeecb; color:#8a6217;}
  .status-locked{background:#eee; color:#999;}
  .lesson-card{position:relative; overflow:hidden;}
  .lesson-card .emoji{font-size:2.2rem;}
  .lesson-card h2{margin-top:6px;}
  .petal-list{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .petal-chip{
    background:#fdf1e0; border:1px solid var(--gold); color:#7a5613; border-radius:16px;
    padding:8px 14px; font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  .petal-chip.new{background:#eef4ea; border-color:var(--green); color:#3f5a34;}
  .lotus-visual{font-size:3.2rem; text-align:center; margin:14px 0;}
  .value-pick{
    display:inline-block; margin:4px; padding:10px 16px; border:2px solid var(--line);
    border-radius:14px; cursor:pointer; font-weight:700; background:#fff;
  }
  .value-pick.selected{border-color:var(--red); background:#fbe6e2; color:var(--red);}
  .flower-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;}
  .flower-tile{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 10px;
    text-align:center; cursor:pointer;
  }
  .flower-tile .fe{font-size:1.8rem;}
  table{width:100%; border-collapse:collapse; font-size:0.9rem;}
  th, td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:center;}
  th{color:var(--ink-soft); font-weight:600;}
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;}
  .menu-tile{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px 10px;
    text-align:center; cursor:pointer; font-weight:700;
  }
  .menu-tile .fe{font-size:1.6rem; display:block; margin-bottom:6px;}
  .toolbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:14px; padding:8px; z-index:50;
  }
  .toolbar button{
    background:none; border:1px solid var(--line); border-radius:10px; padding:6px 12px;
    font-size:0.85rem; cursor:pointer; color:var(--ink-soft);
  }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:30px; font-size:0.9rem; z-index:100; opacity:0.95;
  }
  /* ---- 1차시 STEP2: 단청 관찰(단청을 벗겨 보자) ---- */
  .dancheong-observation{
    width:min(100%, 420px); margin:0 auto; background:#fff; border:1px solid var(--line);
    border-radius:16px; padding:10px;
  }
  .dancheong-observation svg{ display:block; width:100%; height:auto; aspect-ratio:1/1; }
  .element-toggle-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  @media (min-width:480px){ .element-toggle-grid{ grid-template-columns:repeat(4,1fr); } }
  .element-toggle{
    min-height:48px; border-radius:14px; border:2px solid var(--line); background:#f2f2f2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; font-family:inherit; padding:8px 4px;
    transition:background-color .3s ease, border-color .3s ease, color .3s ease;
  }
  .element-toggle .toggle-icon{ font-size:1.3rem; }
  .element-toggle .toggle-label{ font-weight:700; font-size:0.85rem; }
  .element-toggle .toggle-state{ font-size:0.72rem; font-weight:700; letter-spacing:.04em; }
  .element-toggle.is-on[data-element="color"]{ background:#fdeee0; border-color:var(--gold); color:#8a5a12; }
  .element-toggle.is-on[data-element="pattern"]{ background:#e7f0fa; border-color:var(--blue); color:#1f4560; }
  .element-toggle.is-on[data-element="repetition"]{ background:#eef4ea; border-color:var(--green); color:#3f5a34; }
  .element-toggle.is-on[data-element="symmetry"]{ background:#fbe6e2; border-color:var(--red); color:#8f2c22; }
  .element-toggle.is-off{ background:#f0f0f0; border-color:#ccc; color:#888; }
  .dc-live-region{
    margin-top:10px; font-size:0.88rem; color:var(--ink-soft); background:#f6f1e4;
    border-radius:10px; padding:10px 12px; min-height:20px;
  }
  .dc-live-region ul{ margin:0; padding-left:18px; }
  .dc-live-region p{ margin:0; }
  #dancheong-svg .petal-shape, #dancheong-svg .center-dot, #dancheong-svg .asym-shape{
    transition:opacity .4s ease, transform .4s ease;
  }
  #dancheong-svg #flower-artwork{ transition:filter .4s ease; }
  #dancheong-svg #plain-pattern-layer{ transition:opacity .4s ease; opacity:0; }
  #dancheong-svg.pattern-off #plain-pattern-layer{ opacity:1; }
  #dancheong-svg.pattern-off #outer-blue-petals,
  #dancheong-svg.pattern-off #middle-teal-petals,
  #dancheong-svg.pattern-off #inner-pink-petals,
  #dancheong-svg.pattern-off #cream-backing,
  #dancheong-svg.pattern-off #flower-center .center-dot{ opacity:0; }
  #dancheong-svg.color-off #flower-artwork{ filter:grayscale(1); }
  #dancheong-svg.repetition-off .repeat-extra{ opacity:0; }
  #dancheong-svg.symmetry-off .symmetry-target{ opacity:0; }
  #dancheong-svg #asymmetric-layer{ opacity:0; pointer-events:none; transition:opacity .4s ease; }
  #dancheong-svg.symmetry-off #asymmetric-layer{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #dancheong-svg *{ transition:none !important; }
  }
  .footnote{font-size:0.75rem; color:var(--ink-soft); text-align:center; margin-top:24px;}
  .lock-note{background:#f3ede0; border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--ink-soft);}
  a{color:var(--blue);}
  .compare-box{display:flex; gap:10px; align-items:center;}
  .compare-box .arrow{font-size:1.4rem; color:var(--gold);}
  .pin-dots{display:flex; gap:10px; justify-content:center; margin:16px 0;}
  .pin-dots input{
    width:50px; height:56px; text-align:center; font-size:1.4rem; border-radius:12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toolbar">
  <button onclick="App.cycleFontSize()">🔠 글자 크기</button>
  <button onclick="App.speakCurrent()">🔊 읽어주기</button>
</div>
<script>
/* =========================================================
   「단청 이음 연구소」 프론트엔드 (순수 HTML/CSS/JS SPA)
   해시 라우팅 기반. Google Apps Script 웹앱을 API_BASE_URL로 호출한다.
   ========================================================= */

// TODO: Apps Script 배포 후 여기에 웹 앱 URL을 넣으세요.
var API_BASE_URL = 'https://script.google.com/macros/s/AKfycbzjHrUMZhUF5HLp9zErVQbJtgG4nv_0VCiFzm2pTh0z7pdbMNy4w4ZoAFRf-kP6KyxnOg/exec';

// ----------------- 공용 유틸 -----------------

function uid(){
  return 'xxxxxxxx'.replace(/x/g, function(){ return (Math.random()*16|0).toString(16); }) + Date.now().toString(36);
}

function getDeviceId(){
  var id = localStorage.getItem('dcyeon_deviceId');
  if(!id){ id = uid(); localStorage.setItem('dcyeon_deviceId', id); }
  return id;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function api(action, payload){
  payload = payload || {};
  payload.action = action;
  try{
    var res = await fetch(API_BASE_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    var data = await res.json();
    return data;
  }catch(err){
    return { ok:false, error:'서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.' };
  }
}

function toast(msg){
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

function setApp(html){
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}

function loadingHtml(){
  return '<div class="card center"><p>불러오는 중이에요…</p></div>';
}

// ----------------- 접근성: 글자 크기 / TTS -----------------

var FONT_SCALES = [16, 19, 23];
function cycleFontSizeInit(){
  var saved = Number(localStorage.getItem('dcyeon_fontScale') || 16);
  document.documentElement.style.setProperty('--fs-base', saved + 'px');
}
function cycleFontSizeApp(){
  var cur = Number(getComputedStyle(document.documentElement).getPropertyValue('--fs-base')) ||
    Number(localStorage.getItem('dcyeon_fontScale')) || 16;
  var idx = FONT_SCALES.indexOf(cur);
  var next = FONT_SCALES[(idx+1) % FONT_SCALES.length] || 16;
  document.documentElement.style.setProperty('--fs-base', next + 'px');
  localStorage.setItem('dcyeon_fontScale', next);
  toast('글자 크기: ' + (next===16?'기본':next===19?'크게':'아주 크게'));
}
function speakCurrentApp(){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 읽어주기를 지원하지 않아요.'); return; }
  var appEl = document.getElementById('app');
  var text = appEl.innerText || appEl.textContent || '';
  text = text.slice(0, 500);
  if(!text.trim()){ toast('읽을 내용이 없어요.'); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

// ----------------- 세션 상태 -----------------

var Session = {
  get studentCode(){ return localStorage.getItem('dcyeon_studentCode') || ''; },
  set studentCode(v){ localStorage.setItem('dcyeon_studentCode', v || ''); },
  get classCode(){ return localStorage.getItem('dcyeon_classCode') || ''; },
  set classCode(v){ localStorage.setItem('dcyeon_classCode', v || ''); },
  get teacherClassCode(){ return sessionStorage.getItem('dcyeon_teacherClassCode') || ''; },
  set teacherClassCode(v){ sessionStorage.setItem('dcyeon_teacherClassCode', v || ''); },
  get teacherToken(){ return sessionStorage.getItem('dcyeon_teacherToken') || ''; },
  set teacherToken(v){ sessionStorage.setItem('dcyeon_teacherToken', v || ''); },
  clearStudent(){ localStorage.removeItem('dcyeon_studentCode'); localStorage.removeItem('dcyeon_classCode'); },
  clearTeacher(){ sessionStorage.removeItem('dcyeon_teacherClassCode'); sessionStorage.removeItem('dcyeon_teacherToken'); }
};

// ----------------- draft 임시저장 (localStorage 전용) -----------------

var Draft = {
  key(name){ return 'dcyeon_draft_' + (Session.studentCode||'anon') + '_' + name; },
  save(name, data){ localStorage.setItem(this.key(name), JSON.stringify(data)); },
  load(name){
    var raw = localStorage.getItem(this.key(name));
    try{ return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  },
  clear(name){ localStorage.removeItem(this.key(name)); },
  debounced(name, getData, delay){
    delay = delay || 2000;
    var timer = null;
    return function(){
      clearTimeout(timer);
      timer = setTimeout(function(){ Draft.save(name, getData()); }, delay);
    };
  }
};

// ----------------- 라우터 -----------------

var Router = { routes:{} };
function route(path, fn){ Router.routes[path] = fn; }

function parseHash(){
  var h = location.hash.replace(/^#/,'') || '/';
  var qIdx = h.indexOf('?');
  var query = {};
  if(qIdx !== -1){
    var qs = h.slice(qIdx+1); h = h.slice(0, qIdx);
    qs.split('&').forEach(function(pair){
      if(!pair) return;
      var kv = pair.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||'');
    });
  }
  return { path:h, query:query };
}

function renderRoute(){
  var parsed = parseHash();
  var fn = Router.routes[parsed.path];
  if(!fn){ fn = Router.routes['/']; }
  fn(parsed.query);
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', function(){
  cycleFontSizeInit();
  getDeviceId();
  renderRoute();
});

function go(path){ location.hash = '#' + path; }

// App 네임스페이스 (버튼 onclick에서 참조)
var App = {
  cycleFontSize: cycleFontSizeApp,
  speakCurrent: speakCurrentApp
};
</script>
<script>
/* =========================================================
   1단계: 로그인 + 학급 생성 (명세 2~5번)
   ========================================================= */

var _lastCreatedClass = null;

route('/', function(){
  setApp(
    '<div class="top-brand">' +
      '<h1>단청, 색을 입혀 시간을 잇다</h1>' +
      '<div class="sub">단청 이음 연구소</div>' +
      '<div class="motif">🪷</div>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label" for="login-code">나의 이음 코드를 입력하세요.</label>' +
      '<input type="text" id="login-code" placeholder="예: 단청5607" autocomplete="off" />' +
      '<div id="login-error" class="muted" style="color:var(--red); min-height:20px;"></div>' +
      '<button class="btn btn-main" onclick="App.doLogin()">연구소 들어가기</button>' +
    '</div>' +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/create-class\')">＋ 새 학급 만들기</button></div>' +
    '<div class="footnote">이 로그인 방식은 비밀번호가 필요 없어요. 교실 안에서 선생님의 지도 아래 사용하는 것을 전제로 설계되었습니다.</div>'
  );
  var input = document.getElementById('login-code');
  input.focus();
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') App.doLogin(); });
});

App.doLogin = async function(){
  var code = document.getElementById('login-code').value.trim();
  var errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!code){ errEl.textContent = '이음 코드를 입력해 주세요.'; return; }
  var res = await api('login', { code: code });
  if(!res.ok){ errEl.textContent = res.error || '다시 확인해 주세요.'; return; }
  if(res.type === 'student'){
    Session.studentCode = res.studentCode;
    Session.classCode = res.classCode;
    go('/student/home');
  } else if(res.type === 'teacher'){
    Session.teacherClassCode = res.classCode;
    go('/teacher/auth');
  }
};

function suggestClassCode(){
  var school = document.getElementById('cc-school').value.trim();
  var grade = document.getElementById('cc-grade').value.trim();
  var classNum = document.getElementById('cc-classnum').value.trim();
  var base = school.replace(/초등학교$|학교$/,'').slice(0,2);
  var codeField = document.getElementById('cc-code');
  if(codeField.dataset.userEdited === 'true') return;
  if(base && grade && classNum) codeField.value = base + grade + classNum;
}

route('/create-class', function(){
  setApp(
    '<div class="top-brand"><h1>새 학급 만들기</h1><div class="sub">선생님 정보를 입력해 주세요</div></div>' +
    '<div class="card">' +
      '<label class="field-label">학교 이름</label><input type="text" id="cc-school" placeholder="예: 단청초등학교" oninput="suggestClassCode()" />' +
      '<div class="row">' +
        '<div><label class="field-label">학년</label><input type="text" id="cc-grade" placeholder="5" oninput="suggestClassCode()" /></div>' +
        '<div><label class="field-label">반</label><input type="text" id="cc-classnum" placeholder="6" oninput="suggestClassCode()" /></div>' +
      '</div>' +
      '<label class="field-label">학생 수</label><input type="number" id="cc-count" placeholder="24" min="1" max="40" />' +
      '<label class="field-label">학급코드 (자동 제안, 수정 가능)</label>' +
      '<input type="text" id="cc-code" placeholder="단청56" oninput="this.dataset.userEdited=\'true\'" />' +
      '<label class="field-label">교사 관리번호 (4자리 숫자)</label>' +
      '<input type="tel" id="cc-pin" maxlength="4" placeholder="●●●●" />' +
      '<label class="field-label">관리번호 확인</label>' +
      '<input type="tel" id="cc-pin2" maxlength="4" placeholder="●●●●" />' +
      '<label class="field-label">교사 이메일 (선택, 관리번호 분실 시 복구용)</label>' +
      '<input type="email" id="cc-email" placeholder="teacher@school.kr" />' +
      '<div id="cc-error" class="muted" style="color:var(--red); min-height:20px;"></div>' +
      '<button class="btn btn-main" id="cc-submit" onclick="App.doCreateClass()">학급 만들기</button>' +
    '</div>' +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/\')">← 로그인 화면으로</button></div>'
  );
});

App.doCreateClass = async function(){
  var errEl = document.getElementById('cc-error');
  errEl.textContent = '';
  var school = document.getElementById('cc-school').value.trim();
  var grade = document.getElementById('cc-grade').value.trim();
  var classNumber = document.getElementById('cc-classnum').value.trim();
  var count = document.getElementById('cc-count').value.trim();
  var code = document.getElementById('cc-code').value.trim();
  var pin = document.getElementById('cc-pin').value.trim();
  var pin2 = document.getElementById('cc-pin2').value.trim();
  var email = document.getElementById('cc-email').value.trim();

  if(!school || !grade || !classNumber || !count || !code){ errEl.textContent = '필수 항목을 모두 입력해 주세요.'; return; }
  if(!/^\d{4}$/.test(pin)){ errEl.textContent = '관리번호는 4자리 숫자로 입력해 주세요.'; return; }
  if(pin !== pin2){ errEl.textContent = '관리번호가 서로 달라요. 다시 확인해 주세요.'; return; }

  var btn = document.getElementById('cc-submit');

App.doVerifyPin = async function(){
  var classCode = Session.teacherClassCode;
  var pin = document.getElementById('pin-input').value.trim();
  var errEl = document.getElementById('pin-error');
  if(!/^\d{4}$/.test(pin)){ errEl.textContent = '4자리 숫자를 입력해 주세요.'; return; }
  var res = await api('verifyTeacherPin', { classCode: classCode, pin: pin, deviceId: getDeviceId() });
  if(res.locked){
    startPinLockCountdown(res.remainSeconds);
    return;
  }
  if(!res.ok){
    errEl.textContent = (res.error || '관리번호를 다시 확인해 주세요.') +
      (res.remainAttempts!=null ? ' (남은 시도 ' + res.remainAttempts + '회)' : '');
    return;
  }
  Session.teacherToken = res.sessionToken;
  Session.teacherClassCode = classCode;
  go('/teacher/home');
};

function startPinLockCountdown(seconds){
  clearInterval(_pinLockTimer);
  var remain = seconds;
  var errEl = document.getElementById('pin-error');
  var submitBtn = document.getElementById('pin-submit');
  if(submitBtn) submitBtn.disabled = true;
  function tick(){
    if(!errEl) { clearInterval(_pinLockTimer); return; }
    var m = Math.floor(remain/60), s = remain%60;
    errEl.textContent = '잠시 후 다시 시도해 주세요. (남은 시간 ' + m + ':' + (s<10?'0':'')+s + ')';
    remain--;
    if(remain < 0){
      clearInterval(_pinLockTimer);
      errEl.textContent = '';
      if(submitBtn) submitBtn.disabled = false;
    }
  }
  tick();
  _pinLockTimer = setInterval(tick, 1000);
}

App.doResetPin = async function(){

  var res = await api('resetTeacherPin', { classCode: classCode });
  toast(res.ok ? res.message : (res.error || '재설정에 실패했어요.'));
};

// ---------- STEP 2: 단청을 벗겨 보자 (조형 요소 관찰) ----------
//
// 단청 문양(dancheong_flower_blue_pink.svg 참고 구성: 바깥쪽 청색 꽃잎 8개 /
// 중간 청록색 꽃잎 8개 / 안쪽 분홍색 꽃잎 8개 / 중앙 청색 원 / 중앙을 둘러싼
// 노란 점 장식 / 투명 배경 / 방사형 반복·대칭 구조)을 SVG로 직접 구성한다.
// SVG는 화면 진입 시 한 번만 생성하고, 이후 ON/OFF 전환은 <svg> 루트에
// class(color-off/pattern-off/repetition-off/symmetry-off)만 토글해서 처리한다.

var dancheongLayerState = {
  color: true,
  pattern: true,
  repetition: true,
  symmetry: true
};

// 첨부된 dancheong_flower_blue_pink.svg(참고 이미지)를 실측(색상/반지름/각도)해서
// 옮긴 값. 바깥 청색 꽃잎은 0/45/90...(8방향), 중간 청록 꽃잎은 그 사이사이인
// 22.5/67.5/112.5...(8방향)에 놓여 서로 어긋나 있고, 안쪽 분홍 꽃잎은 다시 바깥
// 청색과 같은 각도(0/45/90...)에 자리한다. 분홍 꽃잎 바로 아래에는 살짝 더 큰
// 같은 모양의 미색(cream) 꽃잎을 겹쳐 그려 테두리처럼 보이게 한다.
var DC_ANGLES = [0, 45, 90, 135, 180, 225, 270, 315]; // 기준 8방향 (0=위쪽)
// halfAngle은 각 꽃잎이 "가장 넓어지는 지점"의 반각(半角)이고, wideFrac은 그
// 지점이 밑동(baseR)과 끝(tipR) 사이 어디쯤인지를 나타낸다. 실측 결과 네 겹
// 모두 밑동 바로 근처에서 가장 넓고(wideFrac이 0에 가까움) 끝으로 갈수록
// 뾰족하게 좁아지는 "잎/불꽃" 모양이었다.
var DC_RING_DEFS = {
  outer:  { baseR: 58, tipR: 88, halfAngle: 30, wideFrac: 0.06, angleOffset: 0,    color: '#557fc0', targetBase: 45 },
  middle: { baseR: 36, tipR: 77, halfAngle: 11, wideFrac: 0.33, angleOffset: 22.5, color: '#2caaa6', targetBase: 45 },
  inner:  { baseR: 36, tipR: 56, halfAngle: 23, wideFrac: 0.05, angleOffset: 0,    color: '#f3b4bc' },
  cream:  { baseR: 28, tipR: 60, halfAngle: 30, wideFrac: 0.03, angleOffset: 0,    color: '#fff2e5' }
};
var DC_CENTER_COLOR = '#3479a7';
var DC_CENTER_R = 31;
var DC_DOT_COLOR = '#ffd044';
var DC_DOT_RING_R = 17;
var DC_DOT_R = 5;

// 로컬 좌표계에서 "위쪽(0˚)"을 기준으로 한 극좌표 → 직교좌표 변환.
function dcPolarPoint(r, angleDeg){
  var rad = angleDeg * Math.PI / 180;
  return (r * Math.sin(rad)).toFixed(2) + ',' + (-r * Math.cos(rad)).toFixed(2);
}

// 꽃잎 하나의 path(d)를 생성한다: 중심에서 baseR만큼 떨어진 뾰족한 밑동에서
// 시작해 halfAngle 각도로 벌어지며 부풀었다가 tipR에서 뾰족하게 모인다.
function dcPetalPath(baseR, tipR, halfAngle, wideFrac){
  wideFrac = wideFrac === undefined ? 0.52 : wideFrac;
  var wideR = baseR + (tipR - baseR) * wideFrac;
  var base = dcPolarPoint(baseR, 0);
  var tip = dcPolarPoint(tipR, 0);
  var rightWide = dcPolarPoint(wideR, halfAngle);
  var leftWide = dcPolarPoint(wideR, -halfAngle);
  var c1 = dcPolarPoint(baseR + (wideR - baseR) * 0.7, halfAngle * 0.35);
  var c2 = dcPolarPoint(wideR, halfAngle * 0.85);
  var c3 = dcPolarPoint(wideR + (tipR - wideR) * 0.45, halfAngle * 0.5);
  var c4 = dcPolarPoint(tipR, halfAngle * 0.08);
  var c5 = dcPolarPoint(tipR, -halfAngle * 0.08);
  var c6 = dcPolarPoint(wideR + (tipR - wideR) * 0.45, -halfAngle * 0.5);
  var c7 = dcPolarPoint(wideR, -halfAngle * 0.85);
  var c8 = dcPolarPoint(baseR + (wideR - baseR) * 0.7, -halfAngle * 0.35);
  return 'M' + base +
    ' C' + c1 + ' ' + c2 + ' ' + rightWide +
    ' C' + c3 + ' ' + c4 + ' ' + tip +
    ' C' + c5 + ' ' + c6 + ' ' + leftWide +
    ' C' + c7 + ' ' + c8 + ' ' + base + ' Z';
}

var DC_PATH_OUTER = dcPetalPath(DC_RING_DEFS.outer.baseR, DC_RING_DEFS.outer.tipR, DC_RING_DEFS.outer.halfAngle, DC_RING_DEFS.outer.wideFrac);
var DC_PATH_MIDDLE = dcPetalPath(DC_RING_DEFS.middle.baseR, DC_RING_DEFS.middle.tipR, DC_RING_DEFS.middle.halfAngle, DC_RING_DEFS.middle.wideFrac);
var DC_PATH_INNER = dcPetalPath(DC_RING_DEFS.inner.baseR, DC_RING_DEFS.inner.tipR, DC_RING_DEFS.inner.halfAngle, DC_RING_DEFS.inner.wideFrac);
var DC_PATH_CREAM = dcPetalPath(DC_RING_DEFS.cream.baseR, DC_RING_DEFS.cream.tipR, DC_RING_DEFS.cream.halfAngle, DC_RING_DEFS.cream.wideFrac);

// 오른쪽 절반/왼쪽 절반/축(위·아래) 판정 — 각도가 45의 배수가 아닌 링(중간 청록)에도
// 그대로 적용할 수 있도록 범위로 판정한다.
function dcSymmetryClass(angle){
  var a = ((angle % 360) + 360) % 360;
  if(a === 0 || a === 180) return 'symmetry-axis';
  return (a > 0 && a < 180) ? 'symmetry-right' : 'symmetry-left';
}

// 꽃잎 한 겹을 8방향으로 반복 배치한다. angleOffset을 더해 중간(청록) 겹처럼
// 바깥 겹과 어긋난 위치에 놓을 수 있다. DC_ANGLES의 첫 번째(오프셋만 더한 것)만
// "기본 꽃잎"으로 남기고 나머지 7개는 repeat-extra로 표시해, 반복 OFF일 때
// 위쪽 방향 꽃잎 하나만 남도록 한다. targetBaseAngle이 주어지면 그 기준각의
// 꽃잎에 symmetry-target 클래스를 추가해, 대칭 OFF일 때 이 원본 꽃잎을 숨기고
// asymmetric-layer의 덧그림으로 "교체"되어 보이게 한다.
function dcPetalRingMarkup(groupId, pathD, fillColor, angleOffset, targetBaseAngle){
  angleOffset = angleOffset || 0;
  var parts = ['<g id="' + groupId + '">'];
  DC_ANGLES.forEach(function(baseAngle, idx){
    var angle = baseAngle + angleOffset;
    var extraClass = idx === 0 ? '' : ' repeat-extra';
    var symClass = dcSymmetryClass(angle);
    var targetClass = (targetBaseAngle !== undefined && baseAngle === targetBaseAngle) ? ' symmetry-target' : '';
    parts.push(
      '<g class="repeat-petal ' + symClass + extraClass + targetClass + '" transform="translate(100 100) rotate(' + angle + ')">' +
        '<path class="petal-shape" d="' + pathD + '" fill="' + fillColor + '"/>' +
      '</g>'
    );
  });
  parts.push('</g>');
  return parts.join('');
}

// 중앙을 둘러싼 노란 점 장식 8개 (반복 OFF 시 위쪽 1개만 남음)
function dcCenterDotsMarkup(){
  var parts = [];
  DC_ANGLES.forEach(function(angle, idx){
    var extraClass = idx === 0 ? '' : ' repeat-extra';
    parts.push(
      '<g class="center-dot' + extraClass + '" transform="translate(100 100) rotate(' + angle + ')">' +
        '<circle cx="0" cy="-' + DC_DOT_RING_R + '" r="' + DC_DOT_R + '" fill="' + DC_DOT_COLOR + '"/>' +
      '</g>'
    );
  });
  return parts.join('');
}

// 대칭이 깨진 모습을 보여주는 덧그림 레이어.
// 대칭 OFF가 되면 오른쪽 꽃잎 두 장(바깥 45˚, 중간 67.5˚ 자리 — dcPetalRingMarkup의
// symmetry-target)이 숨겨지고, 그 자리 근처에 크기·색·방향이 다른 꽃잎이 대신
// 나타나 "그 꽃잎이 바뀌었다"는 느낌을 준다(꽃잎을 지우지 않고 다른 꽃잎으로
// 대체되어 보이도록 구성).
function dcAsymmetricLayerMarkup(){
  return '<g id="asymmetric-layer">' +
    '<g class="asym-shape" transform="translate(100 100) rotate(60) scale(1.05)">' +
      '<path d="' + DC_PATH_OUTER + '" fill="#c0392b"/>' +
    '</g>' +
    '<g class="asym-shape" transform="translate(100 100) rotate(84) scale(1.05)">' +
      '<path d="' + DC_PATH_MIDDLE + '" fill="#8bbf5a"/>' +
    '</g>' +
  '</g>';
}

// 문양 OFF일 때 보여줄 "단순한 동심원" (바깥 청색 / 중간 청록 / 안쪽 분홍 원)
function dcPlainPatternLayerMarkup(){
  return '<g id="plain-pattern-layer">' +
    '<circle cx="100" cy="100" r="84" fill="' + DC_RING_DEFS.outer.color + '"/>' +
    '<circle cx="100" cy="100" r="66" fill="' + DC_RING_DEFS.middle.color + '"/>' +
    '<circle cx="100" cy="100" r="46" fill="' + DC_RING_DEFS.inner.color + '"/>' +
  '</g>';
}

// STEP2 화면 진입 시 한 번만 호출해서 SVG 전체 마크업을 만든다.
// 그리는 순서(뒤→앞): 문양 OFF용 동심원 → 중간 청록 → 바깥 청색 → 분홍 뒤 미색
// 테두리 → 안쪽 분홍 → 중앙 원+노란 점 → 대칭 OFF용 덧그림.
function buildDancheongSvgMarkup(){
  return '<svg id="dancheong-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" ' +
      'role="img" aria-label="단청 문양 관찰 그림">' +
    '<g id="flower-artwork">' +
      dcPlainPatternLayerMarkup() +
      dcPetalRingMarkup('middle-teal-petals', DC_PATH_MIDDLE, DC_RING_DEFS.middle.color, DC_RING_DEFS.middle.angleOffset, DC_RING_DEFS.middle.targetBase) +
      dcPetalRingMarkup('outer-blue-petals', DC_PATH_OUTER, DC_RING_DEFS.outer.color, DC_RING_DEFS.outer.angleOffset, DC_RING_DEFS.outer.targetBase) +
      dcPetalRingMarkup('cream-backing', DC_PATH_CREAM, DC_RING_DEFS.cream.color, DC_RING_DEFS.cream.angleOffset) +
      dcPetalRingMarkup('inner-pink-petals', DC_PATH_INNER, DC_RING_DEFS.inner.color, DC_RING_DEFS.inner.angleOffset) +
      '<g id="flower-center">' +
        '<circle cx="100" cy="100" r="' + DC_CENTER_R + '" fill="' + DC_CENTER_COLOR + '"/>' +
        dcCenterDotsMarkup() +
      '</g>' +
      dcAsymmetricLayerMarkup() +
    '</g>' +
  '</svg>';
}

// 상태(dancheongLayerState)가 바뀔 때마다 호출: SVG를 다시 만들지 않고
// 이미 화면에 있는 <svg id="dancheong-svg">에 class만 토글하고,
// 버튼 표시(aria-pressed 포함)와 관찰 안내 문구(aria-live)를 함께 갱신한다.
function updateDancheongLayers(){
  var svg = document.getElementById('dancheong-svg');
  if(!svg) return;

  svg.classList.toggle('color-off', !dancheongLayerState.color);
  svg.classList.toggle('pattern-off', !dancheongLayerState.pattern);
  svg.classList.toggle('repetition-off', !dancheongLayerState.repetition);
  svg.classList.toggle('symmetry-off', !dancheongLayerState.symmetry);

  ['color', 'pattern', 'repetition', 'symmetry'].forEach(function(key){
    var btn = document.querySelector('.element-toggle[data-element="' + key + '"]');
    if(!btn) return;
    var isOn = dancheongLayerState[key];
    btn.classList.toggle('is-on', isOn);
    btn.classList.toggle('is-off', !isOn);
    btn.setAttribute('aria-pressed', isOn ? 'true' : 'false');
    var stateEl = btn.querySelector('.toggle-state');
    if(stateEl) stateEl.textContent = isOn ? 'ON' : 'OFF';
  });

  var messages = [];
  if(!dancheongLayerState.color) messages.push('색이 사라지자 단청의 화려하고 생동감 있는 느낌이 줄어들었어요.');
  if(!dancheongLayerState.pattern) messages.push('꽃잎 장식이 사라지자 단청이 단순한 모습으로 바뀌었어요.');
  if(!dancheongLayerState.repetition) messages.push('되풀이되던 꽃잎이 사라지자 단청의 리듬감이 줄어들었어요.');
  if(!dancheongLayerState.symmetry) messages.push('양쪽 모양이 달라지자 단청의 균형감이 줄어들었어요.');

  var liveEl = document.getElementById('dc-live-region');
  if(liveEl){
    if(messages.length === 0){
      liveEl.innerHTML = '<p>색과 문양이 반복되고 대칭을 이루어 조화로운 단청이 완성되었어요.</p>';
    } else if(messages.length === 1){
      liveEl.innerHTML = '<p>' + messages[0] + '</p>';
    } else {
      liveEl.innerHTML = '<ul>' + messages.map(function(m){ return '<li>' + m + '</li>'; }).join('') + '</ul>';
    }
  }
}

function dcToggleButtonHtml(key, icon, label){
  var isOn = dancheongLayerState[key];
  return '<button type="button" class="element-toggle ' + (isOn ? 'is-on' : 'is-off') + '" ' +
      'data-element="' + key + '" aria-pressed="' + (isOn ? 'true' : 'false') + '" ' +
      'onclick="App.toggleDancheongElement(\'' + key + '\')">' +
    '<span class="toggle-icon">' + icon + '</span>' +
    '<span class="toggle-label">' + label + '</span>' +
    '<span class="toggle-state">' + (isOn ? 'ON' : 'OFF') + '</span>' +
  '</button>';
}

App.toggleDancheongElement = function(key){
  if(!(key in dancheongLayerState)) return;
  dancheongLayerState[key] = !dancheongLayerState[key];
  updateDancheongLayers();
};

App.resetDancheongLayers = function(){
  dancheongLayerState.color = true;
  dancheongLayerState.pattern = true;
  dancheongLayerState.repetition = true;
  dancheongLayerState.symmetry = true;
  updateDancheongLayers();
};

App.pickRemoved = function(el, value){
  document.querySelectorAll('#removed-choice .value-pick').forEach(function(e){ e.classList.remove('selected'); });
  el.classList.add('selected');
  document.getElementById('removed-choice-val').value = value;
  App._saveL1Step2Draft && App._saveL1Step2Draft();
};

var _lotus = { values:[], reasons:[], generalization:'' };

route('/student/lesson1/lotus', async function(){

      (!canComplete ? '<div class="lock-note" style="margin-top:14px;">가치를 3개 이상 발견하면 연꽃의 마음을 완성할 수 있어요. (' + _lotus.values.length + '/3)</div>' : '') +
    '</div>' +
    '<div id="petal-form-area"></div>' +

      '<div class="card">' +
        '<h3>「연꽃의 마음」</h3>' +
        '<p class="muted">이 가치들을 하나로 묶어 말한다면 단청에는 무엇이 담겨 있을까요?</p>' +

        '<button class="btn btn-main" onclick="App.completeLotus()">나의 연꽃 완성하기</button>' +

  var res = await api('saveLesson1Lotus', { studentCode: Session.studentCode, mode:'addPetal', value:value, reason:reason });
  if(!res.ok){ toast(res.error||'저장하지 못했어요.'); return; }

App.editPetalPrompt = async function(idx){
  var current = _lotus.values[idx];
  var newValue = prompt('가치 수정 (최대 10자)', current);
  if(newValue === null) return;
  if(newValue.trim() === ''){
    if(!confirm('이 꽃잎을 삭제할까요?')) return;
    var res = await api('saveLesson1Lotus', { studentCode: Session.studentCode, mode:'deletePetal', index: idx });
    if(!res.ok){ toast(res.error||'삭제하지 못했어요.'); return; }
    _lotus.values = res.lotusValues; renderLotusScreen();
    return;
  }
  var newReason = prompt('까닭 수정 (최대 60자)', '') || '';
  var res2 = await api('saveLesson1Lotus', { studentCode: Session.studentCode, mode:'editPetal', index: idx, value:newValue.slice(0,10), reason:newReason.slice(0,60) });
  if(!res2.ok){ toast(res2.error||'수정하지 못했어요.'); return; }
  _lotus.values = res2.lotusValues; renderLotusScreen();
};

App.completeLotus = async function(){
  var gen = document.getElementById('lotus-gen').value.trim();
  if(!gen){ toast('연꽃의 마음을 적어 주세요.'); return; }
  var res = await api('saveLesson1Lotus', { studentCode: Session.studentCode, mode:'complete', generalization: gen });
  if(!res.ok){ toast(res.error||'완성하지 못했어요.'); return; }
  Draft.clear('l1lotusGen');
  _lotus.generalization = gen;
  go('/student/lesson1/complete');
};

// ---------- STEP 2: 이음 힘 100 배분 (v3 10~12번) ----------

var _groupAlloc = { appearance:0, skill:0, meaning:0 };
var _groupAllocMode = 'first'; // 'first' | 'realloc'
var _groupAllocFirst = null; // 재배분 시 최초 배분값 참조용

function allocLabels(){
  return [
    {key:'appearance', icon:'🏛️', label:'모습 지키기'},
    {key:'skill', icon:'🖌️', label:'기술 이어 주기'},
    {key:'meaning', icon:'💬', label:'의미 나누기'}
  ];
}

route('/student/lesson2/group/allocate', function(query){
  var groupNumber = Number(query.g || App._currentGroup);
  if(!groupNumber){ go('/student/lesson2/group/select'); return; }
  App._startGroupPing(groupNumber);
  _groupAllocMode = 'first';
  _groupAlloc = { appearance:0, skill:0, meaning:0 };
  if(!_groupFirstPriority && App._groupProject && App._groupProject.firstPriority){
    _groupFirstPriority = App._groupProject.firstPriority;
  }
  renderGroupAllocate(groupNumber);
});

function groupAllocSum(){
  return _groupAlloc.appearance + _groupAlloc.skill + _groupAlloc.meaning;
}

function renderGroupAllocate(groupNumber){
  var rows = allocLabels().map(function(o){
    var val = _groupAlloc[o.key];
    return '<div class="row" style="align-items:center; margin:10px 0;">' +
      '<div style="flex:2;">' + o.icon + ' <strong>' + o.label + '</strong></div>' +
      '<button class="btn btn-secondary btn-small" ' + (val<=0?'disabled':'') + ' onclick="App.adjustGroupAlloc(\''+o.key+'\',-10,' + groupNumber + ')">－10</button>' +
      '<div style="flex:0 0 40px; text-align:center; font-weight:700;">' + val + '</div>' +
      '<button class="btn btn-secondary btn-small" onclick="App.adjustGroupAlloc(\''+o.key+'\',10,' + groupNumber + ')">＋10</button>' +
    '</div>';
  }).join('');
  var remain = 100 - groupAllocSum();
  var canSave = groupAllocSum() === 100 &&
    allocLabels().every(function(o){ return _groupAlloc[o.key] >= 10; }) &&
    (_groupAllocMode === 'realloc' || (_groupFirstPriority && _groupAlloc[_groupFirstPriority] >= 50));

  setApp(
    '<div class="top-brand"><h2>STEP 2</h2><h1>이음 힘 100을 나누어 주세요!</h1></div>' +
    '<div class="card">' +
      '<p>단청을 100년 뒤까지 이어 가기 위해 우리 모둠에게 <strong>「이음 힘 100」</strong>이 주어졌습니다.<br>세 가지 길에 어떻게 나누어 사용할지 함께 결정하세요.</p>' +
      '<div class="lock-note" style="text-align:center; font-weight:700;">🔋 남은 이음 힘: ' + remain + '</div>' +
      rows +
      '<div id="group-alloc-area"></div>' +
      '<button class="btn btn-main" id="group-alloc-save" ' + (canSave?'':'disabled') + ' onclick="App.confirmGroupAllocate(' + groupNumber + ')">우리 모둠의 선택 확인하기</button>' +
    '</div>' +
    backNavHtml('이전 단계로')
  );
}

App.adjustGroupAlloc = function(key, delta, groupNumber){
  var next = _groupAlloc[key] + delta;
  if(next < 0) return;
  if(delta > 0 && groupAllocSum() + delta > 100){ toast('남은 이음 힘이 부족해요.'); return; }
  _groupAlloc[key] = next;
  renderGroupAllocate(groupNumber);
};

App.confirmGroupAllocate = function(groupNumber){
  if(groupAllocSum() !== 100){ toast('⚠️ 이음 힘의 합이 100이 되도록 나누어 주세요.'); return; }
  if(_groupAllocMode === 'first' && _groupAlloc[_groupFirstPriority] < 50){
    toast('⚠️ 우리 모둠이 가장 중요하다고 선택한 길에는 이음 힘을 50 이상 주세요.'); return;
  }
  var labels = allocLabels();
  var priorityLabel = labels.filter(function(o){ return o.key===_groupFirstPriority; })[0];
  document.getElementById('group-alloc-area').innerHTML =
    '<div class="card">' +
      '<h3>👥 ' + groupNumber + '모둠의 선택</h3>' +
      labels.map(function(o){ return o.icon + ' ' + o.label + '　' + _groupAlloc[o.key]; }).join('<br>') +
      (priorityLabel ? '<p style="margin-top:8px;"><strong>우리 모둠의 1순위</strong> ' + priorityLabel.icon + ' ' + priorityLabel.label + '</p>' : '') +
      '<h3 style="margin-top:16px;">결정하기 전에 확인!</h3>' +
      '<p><strong>모둠원 모두의 의견을 들어보았나요?</strong></p>' +
      '<div class="row">' +
        '<button class="btn btn-secondary" onclick="document.getElementById(\'group-alloc-area\').innerHTML=\'\'">조금 더 이야기하기</button>' +
        '<button class="btn btn-main" style="margin-top:0;" onclick="App.saveGroupFirstDecision(' + groupNumber + ')">우리 모둠 선택 확정</button>' +
      '</div>' +
    '</div>';
  document.getElementById('group-alloc-area').scrollIntoView({behavior:'smooth'});
};

  _groupFirstPriority = gp.firstPriority;
  renderGroupReallocate(groupNumber, gp);
});

function renderGroupReallocate(groupNumber, gp){
  var rows = allocLabels().map(function(o){
    var val = _groupAlloc[o.key];
    return '<div class="row" style="align-items:center; margin:10px 0;">' +
      '<div style="flex:2;">' + o.icon + ' <strong>' + o.label + '</strong></div>' +
      '<button class="btn btn-secondary btn-small" ' + (val<=0?'disabled':'') + ' onclick="App.adjustGroupRealloc(\''+o.key+'\',-10,' + groupNumber + ')">－10</button>' +
      '<div style="flex:0 0 40px; text-align:center; font-weight:700;">' + val + '</div>' +
      '<button class="btn btn-secondary btn-small" onclick="App.adjustGroupRealloc(\''+o.key+'\',10,' + groupNumber + ')">＋10</button>' +
    '</div>';
  }).join('');
  var remain = 100 - groupAllocSum();
  var canSave = groupAllocSum() === 100 && allocLabels().every(function(o){ return _groupAlloc[o.key] >= 10; });
  setApp(
    '<div class="top-brand"><h2>STEP 6</h2><h1>다시 나누어 보기</h1></div>' +
    '<div class="card">' +
      '<h3>처음의 선택</h3>' +
      '<p>모습 ' + gp.firstAppearance + ' │ 기술 ' + gp.firstSkill + ' │ 의미 ' + gp.firstMeaning + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="lock-note" style="text-align:center; font-weight:700;">🔋 남은 이음 힘: ' + remain + '</div>' +
      rows +
      '<button class="btn btn-main" ' + (canSave?'':'disabled') + ' onclick="App.saveGroupReallocate(' + groupNumber + ')">저장하기</button>' +
    '</div>' +
    backNavHtml('모둠 회의로')
  );
}

App.adjustGroupRealloc = function(key, delta, groupNumber){
  var next = _groupAlloc[key] + delta;
  if(next < 0) return;
  if(delta > 0 && groupAllocSum() + delta > 100){ toast('남은 이음 힘이 부족해요.'); return; }
  _groupAlloc[key] = next;
  renderGroupReallocate(groupNumber, App._groupProject);
};

App.saveGroupReallocate = async function(groupNumber){
  if(groupAllocSum() !== 100){ toast('⚠️ 이음 힘의 합이 100이 되도록 나누어 주세요.'); return; }
  var res = await api('saveGroupFinalDecision', {
    classCode: Session.classCode, groupNumber: groupNumber, requestId: uid(), decision: 'change',
    finalAppearance: _groupAlloc.appearance, finalSkill: _groupAlloc.skill, finalMeaning: _groupAlloc.meaning
  });
  if(!res.ok){ toast(res.error||'저장하지 못했어요.'); return; }
  App._groupProject = res;
  go('/student/lesson2/group/reason?g=' + groupNumber);
};

  first = Number(first)||0; final_ = Number(final_)||0;

  var diffLabel = diff > 0 ? ' ↑' + diff : (diff < 0 ? ' ↓' + Math.abs(diff) : ' ―');
  return '<tr><td style="text-align:left;">' + icon + ' ' + label + '</td><td>' + first + '</td><td>' + final_ + diffLabel + '</td></tr>';
}

      '<h3 style="margin-top:20px;">수업 후 단청을 더 알아보고 싶은 마음은 어느 정도인가요?</h3>' +

      return { value: document.getElementById('added-value').value, reason: document.getElementById('added-reason').value };
    });
    document.getElementById('added-value').addEventListener('input', savePetal);
    document.getElementById('added-reason').addEventListener('input', savePetal);

App.saveLesson2Final = async function(){
  var postU = document.getElementById('post-understanding').value;
  var postI = document.getElementById('post-interest').value;
  var finalConcept = document.getElementById('final-concept').value.trim();
  if(!postU || !postI || !finalConcept){ toast('모든 항목을 입력해 주세요.'); return; }
  var payload = { studentCode: Session.studentCode, postUnderstanding: postU, postInterest: postI, finalConcept: finalConcept };
  if(_addPetalMode === 'add'){
    var av = document.getElementById('added-value').value.trim();
    var ar = document.getElementById('added-reason').value.trim();
    if(av){ payload.addedValue = av; payload.addedValueReason = ar; }
  }
  var res = await api('saveLesson2Final', payload);
  if(!res.ok){ toast(res.error||'저장하지 못했어요.'); return; }
  Draft.clear('l2addedPetal'); Draft.clear('l2finalConcept');
  go('/student/final');
};

        '<h3>연꽃 가치</h3><p>' + rec.lotusValues.map(escapeHtml).join(' · ') + '</p>' +
        '<h3>연꽃 가치 이유</h3><p>' + rec.lotusReasons.map(escapeHtml).join(' / ') + '</p>' +
        '<h3>연꽃의 마음</h3><p>' + escapeHtml(rec.lesson1Generalization) + '</p>' +
        '<h3>새롭게 추가한 가치</h3><p>' + escapeHtml(rec.addedValue) + ' — ' + escapeHtml(rec.addedValueReason) + '</p>' +
        '<h3>사후 이해도 / 관심도</h3><p>' + escapeHtml(rec.postUnderstanding) + ' / ' + escapeHtml(rec.postInterest) + '</p>' +
        '<h3>최종 생각</h3><p>' + escapeHtml(rec.finalConcept) + '</p>' +
      '</div>' +
      '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/records\')">← 학생 목록으로</button></div>'
    );

  }
  setApp(loadingHtml());
  var res = await fetchTeacherDashboard();

  var rows = res.progress.map(function(p){
    return '<div class="menu-tile" onclick="go(\'/teacher/records?code=' + encodeURIComponent(p.studentCode) + '\')">' + p.studentNumber + '번</div>';

    '<div class="top-brand"><h2>② 학생 기록</h2><p class="muted">학생 번호를 눌러 개인 기록을 확인하세요.</p></div>' +
    '<div class="menu-grid">' + rows + '</div>' +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/home\')">← 교사 연구실로</button></div>'

});

// ---------- 36. 연꽃 가치 ----------

function barListHtml(items){
  if(!items.length) return '<p class="muted">데이터가 없어요.</p>';
  var max = items[0].count || 1;
  return items.map(function(it){
    var pct = Math.max(8, Math.round((it.count/max)*100));
    return '<div style="margin:8px 0;"><div style="display:flex; justify-content:space-between;"><span>' + escapeHtml(it.value) + '</span><span>' + it.count + '</span></div>' +
      '<div style="background:#eee; border-radius:8px; height:10px;"><div style="width:'+pct+'%; background:var(--gold); height:10px; border-radius:8px;"></div></div></div>';
  }).join('');
}

// ---------- 37~38. 이음 프로젝트 (v3 신규) ----------

route('/teacher/groups', async function(query){
  if(!requireTeacherSession()) return;
  if(query && query.g){
    setApp(loadingHtml());
    var rec = await api('getGroupProjectDetail', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, groupNumber: query.g });
    if(rec.authExpired){ Session.clearTeacher(); go('/'); return; }
    if(!rec.ok){ setApp('<div class="card center"><p>' + escapeHtml(rec.error) + '</p></div>'); return; }
    var stepLabel = { priority:'진행 중 (1순위)', allocation:'진행 중 (배분)', confirmed:'진행 중 (상황 대기)',
      situation_shown:'진행 중 (모둠 회의)', keeping:'진행 중 (이유 기록)', redeciding:'진행 중 (재배분)',
      reason:'진행 중 (이유 기록)', done:'완료' }[rec.groupStep] || rec.groupStep;
    setApp(
      '<div class="top-brand"><h2>👥 ' + escapeHtml(String(rec.groupNumber)) + '모둠</h2></div>' +
      '<div class="card">' +
        '<p><strong>대표 학생</strong> ' + escapeHtml(rec.representativeStudentCode||'-') + '</p>' +
        '<p><strong>상태</strong> ' + escapeHtml(stepLabel) + '</p>' +
        '<h3>최초 1순위</h3><p>' + escapeHtml(rec.firstPriority||'-') + '</p>' +
        '<h3>최초 배분</h3><p>모습 ' + (rec.firstAppearance??'-') + ' / 기술 ' + (rec.firstSkill??'-') + ' / 의미 ' + (rec.firstMeaning??'-') + '</p>' +
        '<h3>제시된 상황</h3><p>' + escapeHtml(rec.situationType||'-') + '</p>' +
        '<h3>유지/변경</h3><p>' + (rec.decision==='keep'?'유지':rec.decision==='change'?'변경':'-') + '</p>' +
        '<h3>최종 배분</h3><p>모습 ' + (rec.finalAppearance??'-') + ' / 기술 ' + (rec.finalSkill??'-') + ' / 의미 ' + (rec.finalMeaning??'-') + '</p>' +
        '<h3>판단 이유</h3><p>' + escapeHtml(rec.decisionReason||'-') + '</p>' +
        '<h3>완료 시각</h3><p>' + escapeHtml(rec.projectCompletedAt||'-') + '</p>' +
        '<button class="btn btn-danger" style="margin-top:14px;" onclick="App.resetGroupProject(' + rec.groupNumber + ')">프로젝트 초기화</button>' +
      '</div>' +
      '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/groups\')">← 모둠 목록으로</button></div>'
    );
    return;
  }
  setApp(loadingHtml());
  var res = await api('getClassGroupStats', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken });
  if(res.authExpired){ Session.clearTeacher(); go('/'); return; }
  if(!res.ok){ setApp('<div class="card center"><p>' + escapeHtml(res.error) + '</p></div>'); return; }
  var rows = (res.groups||[]).map(function(g){
    var statusLabel = g.groupStep === 'done' ? '완료' : (g.groupStep ? '진행 중' : '-');
    var decisionLabel = g.decision === 'keep' ? '유지' : (g.decision === 'change' ? '변경' : '-');
    return '<tr onclick="go(\'/teacher/groups?g=' + g.groupNumber + '\')" style="cursor:pointer;">' +
      '<td>' + g.groupNumber + '</td><td>' + escapeHtml(g.firstPriority||'-') + '</td>' +
      '<td>' + (g.firstAppearance??'-') + '/' + (g.firstSkill??'-') + '/' + (g.firstMeaning??'-') + '</td>' +
      '<td>' + escapeHtml(g.situationType||'-') + '</td><td>' + decisionLabel + '</td>' +
      '<td>' + (g.finalAppearance??'-') + '/' + (g.finalSkill??'-') + '/' + (g.finalMeaning??'-') + '</td>' +
      '<td>' + statusLabel + '</td>' +
    '</tr>';
  }).join('');
  setApp(
    '<div class="top-brand"><h2>👥 이음 프로젝트</h2></div>' +
    '<div class="card">' +
      '<div style="overflow-x:auto;"><table><thead><tr><th>모둠</th><th>1순위</th><th>최초배분</th><th>상황</th><th>판단</th><th>최종배분</th><th>상태</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="7" class="muted">아직 시작된 모둠이 없어요.</td></tr>') + '</tbody></table></div>' +
      '<p class="muted" style="margin-top:10px;">행을 누르면 모둠별 세부 내용을 볼 수 있어요.</p>' +
      '<h3 style="margin-top:16px;">최초 1순위 분포</h3><p>' +
        '🏛️ 모습 지키기　' + (res.priorityCounts&&res.priorityCounts.appearance||0) + '모둠　' +
        '🖌️ 기술 이어 주기　' + (res.priorityCounts&&res.priorityCounts.skill||0) + '모둠　' +
        '💬 의미 나누기　' + (res.priorityCounts&&res.priorityCounts.meaning||0) + '모둠</p>' +
      '<h3>상황 이후 판단</h3><p>' +
        '처음 선택 유지　' + (res.decisionCounts&&res.decisionCounts.keep||0) + '모둠　' +
        '선택 변경　' + (res.decisionCounts&&res.decisionCounts.change||0) + '모둠</p>' +
    '</div>' +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/home\')">← 교사 연구실로</button></div>'
  );
});

App.resetGroupProject = async function(groupNumber){
  if(!confirm(groupNumber + '모둠의 프로젝트를 초기화합니다. 이 작업은 되돌릴 수 없어요. 계속할까요?')) return;
  var res = await api('resetGroupProject', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, groupNumber: groupNumber });
  toast(res.ok ? '모둠 프로젝트를 초기화했어요.' : (res.error||'초기화하지 못했어요.'));
  if(res.ok) go('/teacher/groups');
};

// ---------- 39(v2 37). 수업 전후 변화 ----------

route('/teacher/changes', async function(){
  if(!requireTeacherSession()) return;
  setApp(loadingHtml());
  var res = await api('getClassChangeStats', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken });
  if(res.authExpired){ Session.clearTeacher(); go('/'); return; }
  if(!res.ok){ setApp('<div class="card center"><p>' + escapeHtml(res.error) + '</p></div>'); return; }
  var u = res.understanding, i = res.interest;
  var compares = res.compares.map(function(c){
    return '<div class="card"><div class="compare-box"><div><strong>처음</strong><br>' + escapeHtml(c.preConcept) + '</div>' +
      '<div class="arrow">→</div><div><strong>마지막</strong><br>' + escapeHtml(c.finalConcept) + '</div></div></div>';
  }).join('');
  setApp(
    '<div class="top-brand"><h2>④ 수업 전후 변화</h2></div>' +
    '<div class="card">' +
      '<h3>이해도</h3><p>수업 전 평균 ' + u.pre + ' → 수업 후 평균 ' + u.post + ' (+' + Math.round((u.post-u.pre)*10)/10 + ')</p>' +
      '<div style="background:#eee; border-radius:8px; height:14px;"><div style="width:' + (u.post/5*100) + '%; background:var(--blue); height:14px; border-radius:8px;"></div></div>' +
      '<h3 style="margin-top:16px;">관심도</h3><p>수업 전 평균 ' + i.pre + ' → 수업 후 평균 ' + i.post + ' (+' + Math.round((i.post-i.pre)*10)/10 + ')</p>' +
      '<div style="background:#eee; border-radius:8px; height:14px;"><div style="width:' + (i.post/5*100) + '%; background:var(--green); height:14px; border-radius:8px;"></div></div>' +
    '</div>' +
    '<h3 style="margin:16px 4px;">처음 생각 ↔ 마지막 생각</h3>' +
    (compares || '<p class="muted">아직 비교할 데이터가 없어요.</p>') +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/home\')">← 교사 연구실로</button></div>'
  );
});

// ---------- 40(v2 38). 학급 설정 / 41(v2 39). 데이터 내려받기 ----------

route('/teacher/settings', async function(){
  if(!requireTeacherSession()) return;
  setApp(loadingHtml());
  var res = await fetchTeacherDashboard();
  if(!res) return;
  var ci = res.classInfo;
  var studentOptions = res.progress.map(function(p){
    return '<option value="' + escapeHtml(p.studentCode) + '">' + p.studentNumber + '번 (' + escapeHtml(p.studentCode) + ')</option>';
  }).join('');
  setApp(
    '<div class="top-brand"><h2>⑤ 학급 설정</h2></div>' +
    '<div class="card">' +
      '<label class="field-label">학급명(학교 이름)</label>' +
      '<input type="text" id="set-school" value="' + escapeHtml(ci.schoolName) + '" />' +
      '<button class="btn btn-secondary btn-small" style="margin-top:8px;" onclick="App.updateSchoolName()">저장</button>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">학생 수 (현재 ' + ci.studentCount + '명)</label>' +
      '<input type="number" id="set-count" value="' + ci.studentCount + '" min="1" max="40" />' +
      '<button class="btn btn-secondary btn-small" style="margin-top:8px;" onclick="App.updateStudentCount()">저장</button>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">모둠 수 (현재 ' + (ci.groupCount||6) + '모둠)</label>' +
      '<input type="number" id="set-group-count" value="' + (ci.groupCount||6) + '" min="1" max="10" />' +
      '<button class="btn btn-secondary btn-small" style="margin-top:8px;" onclick="App.updateGroupCount()">저장</button>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">2차시 열기 / 잠그기</label>' +
      '<button class="btn ' + (ci.lesson2Unlocked?'btn-main':'btn-secondary') + '" onclick="App.toggleLesson2(' + (!ci.lesson2Unlocked) + ')">' +
        (ci.lesson2Unlocked ? '🔓 열려 있음 (누르면 잠그기)' : '🔒 잠겨 있음 (누르면 열기)') + '</button>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">관리번호 변경</label>' +
      '<input type="tel" id="set-cur-pin" maxlength="4" placeholder="현재 관리번호" />' +
      '<input type="tel" id="set-new-pin" maxlength="4" placeholder="새 관리번호" style="margin-top:8px;" />' +
      '<button class="btn btn-secondary btn-small" style="margin-top:8px;" onclick="App.changePin()">변경</button>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">학생 기록 초기화</label>' +
      '<p class="muted">되돌릴 수 없어요. 신중히 선택해 주세요.</p>' +
      '<button class="btn btn-danger" onclick="App.resetAll()">학급 전체 초기화 (새 학기 재사용)</button>' +
      '<div style="margin-top:10px;">' +
        '<select id="set-reset-student">' + studentOptions + '</select>' +
        '<button class="btn btn-danger btn-small" style="margin-top:8px;" onclick="App.resetSingle()">선택한 학생만 초기화</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<label class="field-label">데이터 내려받기</label>' +
      '<button class="btn btn-main" onclick="App.downloadCsv()">학급 기록 내려받기 (CSV)</button>' +
      '<button class="btn btn-secondary" style="margin-top:10px;" onclick="App.downloadGroupCsv()">이음 프로젝트 내려받기 (CSV)</button>' +
    '</div>' +
    '<div class="center"><button class="btn btn-ghost" onclick="go(\'/teacher/home\')">← 교사 연구실로</button></div>'
  );
});

App.updateSchoolName = async function(){
  var v = document.getElementById('set-school').value.trim();
  var res = await api('updateClassSettings', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, schoolName: v });
  toast(res.ok ? '저장했어요.' : (res.error||'저장하지 못했어요.'));
};

App.updateStudentCount = async function(confirmReduce){
  var v = document.getElementById('set-count').value;
  var res = await api('updateClassSettings', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, studentCount: v, confirmReduce: !!confirmReduce });
  if(res.needsConfirm){
    var names = res.affectedStudents.join(', ');
    if(confirm(names + ' 학생은 기록이 있습니다. 정말 삭제할까요? (30일간 복구 가능)')){
      App.updateStudentCount(true);
    }
    return;
  }
  toast(res.ok ? '학생 수를 변경했어요.' : (res.error||'변경하지 못했어요.'));
  if(res.ok) go('/teacher/settings');
};

App.updateGroupCount = async function(){
  var v = Number(document.getElementById('set-group-count').value);
  var res = await api('updateClassSettings', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, groupCount: v });
  if(res.warning){ toast(res.warning); }
  toast(res.ok ? '모둠 수를 변경했어요.' : (res.error||'변경하지 못했어요.'));
  if(res.ok) go('/teacher/settings');
};

App.toggleLesson2 = async function(nextVal){
  var res = await api('updateClassSettings', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, lesson2Unlocked: nextVal });
  toast(res.ok ? (nextVal ? '2차시를 열었어요.' : '2차시를 잠갔어요.') : (res.error||'변경하지 못했어요.'));
  if(res.ok) go('/teacher/settings');
};

App.changePin = async function(){
  var cur = document.getElementById('set-cur-pin').value.trim();
  var next = document.getElementById('set-new-pin').value.trim();
  var res = await api('updateClassSettings', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, currentPIN: cur, newPIN: next });
  toast(res.ok ? '관리번호를 변경했어요.' : (res.error||'변경하지 못했어요.'));
};

App.resetAll = async function(){
  if(!confirm('학급 전체 기록을 초기화합니다. 이 작업은 되돌릴 수 없어요. 계속할까요?')) return;
  var res = await api('resetStudentRecord', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, scope:'all' });
  toast(res.ok ? '전체 초기화를 완료했어요.' : (res.error||'초기화하지 못했어요.'));
};

App.resetSingle = async function(){
  var code = document.getElementById('set-reset-student').value;
  if(!confirm(code + ' 학생의 기록만 초기화합니다. 이 작업은 되돌릴 수 없어요. 계속할까요?')) return;
  var res = await api('resetStudentRecord', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken, scope:'single', studentCode: code });
  toast(res.ok ? '해당 학생 기록을 초기화했어요.' : (res.error||'초기화하지 못했어요.'));
};

App.downloadCsv = async function(){
  var res = await api('exportClassData', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken });
  if(!res.ok){ toast(res.error||'내려받지 못했어요.'); return; }
  var blob = new Blob(['﻿' + res.csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = res.filename || 'class_export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

App.downloadGroupCsv = async function(){
  var res = await api('exportGroupData', { classCode: Session.teacherClassCode, sessionToken: Session.teacherToken });
  if(!res.ok){ toast(res.error||'내려받지 못했어요.'); return; }
  var blob = new Blob(['﻿' + res.csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = res.filename || 'group_export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>
